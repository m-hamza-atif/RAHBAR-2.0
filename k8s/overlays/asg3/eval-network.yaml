apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eval-api
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: eval
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: api
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-eval
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: eval
    ports:
    - protocol: TCP
      port: 8000
